[project]
name = "backend"
version = "0.1.0"
description = "FHI Helsedata-utforsker: influensa, RSV og SARS-CoV-2 fra FHIs åpne statistikk"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.11.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
