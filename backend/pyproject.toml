[project]
name = "backend"
version = "0.1.0"
description = "FHI Helsedata-utforsker: influensa, RSV og SARS-CoV-2 fra FHIs åpne statistikk"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.11.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Ingen test får nå nettet (NFR-10, AD-10). Alle socketkall gir SocketBlockedError.
addopts = ["--disable-socket"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# I: importrekkefølge, UP: moderne Python, B: vanlige feil.
# PLW1510: subprocess.run uten check (fant en feil i story 1.1).
extend-select = ["I", "UP", "B", "PLW1510"]
